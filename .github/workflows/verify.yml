name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Historical setup diagnostic (26.12.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
          cache: npm
      - name: Verify historical source and diagnostic overlay
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const original = "f47279d4551cf6a1508fb1a84eda6f5c73745137";
          assert.equal(process.versions.node, "26.12.0");
          assert.equal(execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(), "11.20.0");
          const changes = execFileSync("git", ["diff", "--name-only", original, "HEAD"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          assert.deepEqual(changes.sort(), [
            ".github/workflows/verify.yml",
            "tests/helpers/public_cli.mjs",
            "tests/unit/project/setup.test.mjs",
          ]);
          const expected = {
            "package-lock.json": "b0f190235953afdf7fcbc2ffc11e4450cab0ed8579565072cfe2650e83b18b97",
            "tests/helpers/public_cli.mjs": "05058bf1085df087f44c4f60f1658588fa0e33b4537a86757001abccad40e050",
            "tests/unit/project/setup.test.mjs": "f3bad66a9b9d5f5c63b1f8f52cc5a51674d0d4973ac15b41b044399d8fc60de6",
          };
          for (const [path, digest] of Object.entries(expected))
            assert.equal(createHash("sha256").update(readFileSync(path)).digest("hex"), digest);
          console.log(JSON.stringify({
            diagnostic: "RDB-196",
            historicalSource: original,
            overlayCommit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            node: process.versions.node,
            npm: "11.20.0",
            scope: "one historical testcase; no historical-cause claim",
          }));
          NODE
      - run: npm ci --ignore-scripts
      - name: Run the original setup testcase once
        run: npm test -- tests/unit/project/setup.test.mjs -t "exposes preview and explicit write through the public CLI"
