name: Publish approved release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    outputs:
      package_name: ${{ steps.candidate.outputs.package_name }}
      package_version: ${{ steps.candidate.outputs.package_version }}
      tarball: ${{ steps.candidate.outputs.tarball }}
      sha1: ${{ steps.candidate.outputs.sha1 }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      publish_tag: ${{ steps.candidate.outputs.publish_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate and pack the exact release candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_PRIVATE="$(node -p "require('./package.json').private")"

          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$PACKAGE_PRIVATE" = "false"

          RELEASE_CHANNEL="$(node scripts/release/channel.mjs "$PACKAGE_VERSION" "$RELEASE_PRERELEASE")"
          PUBLISH_TAG="$(node -e 'const channel=JSON.parse(process.argv[1]); process.stdout.write(channel.npmTag)' "$RELEASE_CHANNEL")"

          npm pack --json --ignore-scripts > pack-result.json
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('pack-result.json', 'utf8'))[0].filename")"
          SHA1="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"

          node -e "const fs=require('fs'); fs.writeFileSync('release-metadata.json', JSON.stringify({name:process.argv[1],version:process.argv[2],tag:process.argv[3],tarball:process.argv[4],sha1:process.argv[5],sha256:process.argv[6]}, null, 2)+'\n')" "$PACKAGE_NAME" "$PACKAGE_VERSION" "$RELEASE_TAG" "$TARBALL" "$SHA1" "$SHA256"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "publish_tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-candidate
          path: |
            ${{ steps.candidate.outputs.tarball }}
            release-metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
      TARBALL: ${{ needs.prepare.outputs.tarball }}
      EXPECTED_SHA1: ${{ needs.prepare.outputs.sha1 }}
      EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
      PUBLISH_TAG: ${{ needs.prepare.outputs.publish_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Verify the approved artifact
        run: |
          echo "$EXPECTED_SHA1  $TARBALL" | sha1sum --check --strict
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum --check --strict
      - name: Publish with trusted OIDC
        run: |
          REGISTRY_SHA1="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.shasum 2>/dev/null || true)"
          if test -z "$REGISTRY_SHA1"; then
            npm publish "$TARBALL" --access public --tag "$PUBLISH_TAG" --provenance
          elif test "$REGISTRY_SHA1" = "$EXPECTED_SHA1"; then
            echo "The exact approved candidate is already published; continuing verification."
          else
            echo "The published version does not match the approved candidate." >&2
            exit 1
          fi
      - name: Verify the registry artifact and executable
        run: |
          for attempt in {1..36}; do
            REGISTRY_SHA1="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.shasum 2>/dev/null || true)"
            if test "$REGISTRY_SHA1" = "$EXPECTED_SHA1"; then
              break
            fi
            if test "$attempt" = "36"; then
              echo "Registry artifact did not match the approved candidate after six minutes." >&2
              exit 1
            fi
            sleep 10
          done

          VERIFY_DIR="$(mktemp -d)"
          cd "$VERIFY_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$PACKAGE_NAME@$PACKAGE_VERSION"
          npx --no-install rehearsal --help >/dev/null
          for attempt in {1..36}; do
            if npm audit signatures; then
              break
            fi
            if test "$attempt" = "36"; then
              echo "Registry signatures or provenance did not become available after six minutes." >&2
              exit 1
            fi
            sleep 10
          done
      - name: Update the reviewed npm release channel
        run: |
          if test "$PUBLISH_TAG" = "beta"; then
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" beta

            DIST_TAGS="$(npm view "$PACKAGE_NAME" dist-tags --json)"
            CURRENT_LATEST="$(node -e 'const tags=JSON.parse(process.argv[1]); process.stdout.write(tags.latest ?? "")' "$DIST_TAGS")"
            case "$CURRENT_LATEST" in
              ""|*-*) npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" latest ;;
              *) echo "Stable latest tag remains on $CURRENT_LATEST." ;;
            esac
          else
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" latest
          fi

          for attempt in {1..12}; do
            DIST_TAGS="$(npm view "$PACKAGE_NAME" dist-tags --json)"
            if node -e 'const tags=JSON.parse(process.argv[1]); const version=process.argv[2]; const channel=process.argv[3]; const stableLatest=typeof tags.latest === "string" && !tags.latest.includes("-"); const valid=channel === "beta" ? tags.beta === version && (tags.latest === version || stableLatest) : tags.latest === version; process.exit(valid ? 0 : 1)' "$DIST_TAGS" "$PACKAGE_VERSION" "$PUBLISH_TAG"; then
              exit 0
            fi
            if test "$attempt" = "12"; then
              echo "The $PUBLISH_TAG release tag did not update after one minute." >&2
              exit 1
            fi
            sleep 5
          done

  sync-tags:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Repair tags for the current package version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_PRERELEASE="$(node -e 'process.stdout.write(process.argv[1].includes("-") ? "true" : "false")' "$PACKAGE_VERSION")"
          RELEASE_CHANNEL="$(node scripts/release/channel.mjs "$PACKAGE_VERSION" "$PACKAGE_PRERELEASE")"
          PUBLISH_TAG="$(node -e 'const channel=JSON.parse(process.argv[1]); process.stdout.write(channel.npmTag)' "$RELEASE_CHANNEL")"

          REGISTRY_VERSION="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version)"
          test "$REGISTRY_VERSION" = "$PACKAGE_VERSION"

          if test "$PUBLISH_TAG" = "beta"; then
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" beta

            DIST_TAGS="$(npm view "$PACKAGE_NAME" dist-tags --json)"
            CURRENT_LATEST="$(node -e 'const tags=JSON.parse(process.argv[1]); process.stdout.write(tags.latest ?? "")' "$DIST_TAGS")"
            case "$CURRENT_LATEST" in
              ""|*-*) npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" latest ;;
              *) echo "Stable latest tag remains on $CURRENT_LATEST." ;;
            esac
          else
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" latest
          fi

          for attempt in {1..12}; do
            DIST_TAGS="$(npm view "$PACKAGE_NAME" dist-tags --json)"
            if node -e 'const tags=JSON.parse(process.argv[1]); const version=process.argv[2]; const channel=process.argv[3]; const stableLatest=typeof tags.latest === "string" && !tags.latest.includes("-"); const valid=channel === "beta" ? tags.beta === version && (tags.latest === version || stableLatest) : tags.latest === version; process.exit(valid ? 0 : 1)' "$DIST_TAGS" "$PACKAGE_VERSION" "$PUBLISH_TAG"; then
              exit 0
            fi
            if test "$attempt" = "12"; then
              echo "The $PUBLISH_TAG release tag did not update after one minute." >&2
              exit 1
            fi
            sleep 5
          done
