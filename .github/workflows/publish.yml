name: Publish approved release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Require an explicitly publishable manifest
        run: node -e "const p=require('./package.json'); if(p.private!==false) throw new Error('package.json private must be explicitly set to false in the approved release')"
      - run: npm publish --access public --provenance
