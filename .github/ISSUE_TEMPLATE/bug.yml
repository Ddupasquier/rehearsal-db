name: Bug report
description: Report a reproducible Rehearsal defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, source rows, private URLs, or baseline artifacts. Use private vulnerability reporting for security issues.
  - type: input
    id: versions
    attributes:
      label: Environment
      description: OS, architecture, Node, Supabase CLI, and Docker versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest data-safe steps and command output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
