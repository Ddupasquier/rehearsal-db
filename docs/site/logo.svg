<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Rehearsal</title>
  <desc id="description">A solid database becomes a safe rehearsal copy with a play symbol. Safer changes, brighter deploys.</desc>
  <defs>
    <linearGradient id="navy" x1="10" y1="8" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334957"/>
      <stop offset="1" stop-color="#17242D"/>
    </linearGradient>
    <linearGradient id="mint" x1="67" y1="43" x2="102" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68D6AA"/>
      <stop offset="1" stop-color="#3EAF83"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#10202A" flood-opacity=".2"/>
    </filter>
    <clipPath id="left-half">
      <rect x="10" y="8" width="54" height="112"/>
    </clipPath>
    <g id="database-mark">
      <g clip-path="url(#left-half)">
        <path d="M16 31c0-10.5 21.5-19 48-19s48 8.5 48 19v65c0 10.5-21.5 19-48 19s-48-8.5-48-19V31Z" fill="url(#navy)"/>
        <ellipse cx="64" cy="31" rx="48" ry="19" fill="#344A58"/>
        <path d="M16 49c0 10.5 21.5 19 48 19s48-8.5 48-19M16 72c0 10.5 21.5 19 48 19s48-8.5 48-19M16 95c0 10.5 21.5 19 48 19s48-8.5 48-19" fill="none" stroke="#AAB8C0" stroke-opacity=".56" stroke-width="1.4"/>
      </g>
      <path d="M64 12c26.5 0 48 8.5 48 19v65c0 10.5-21.5 19-48 19" fill="#F4FBF8" fill-opacity=".72" stroke="#A9C4B8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
      <path d="M64 68c26.5 0 48-8.5 48-19M64 91c26.5 0 48-8.5 48-19M64 114c26.5 0 48-8.5 48-19" fill="none" stroke="#A9C4B8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
      <path d="M64 13v102" stroke="#5BC99C" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <path d="m69 48 31 20-31 20V48Z" fill="url(#mint)" stroke="#278D66" stroke-width="1.5" stroke-linejoin="round" filter="url(#soft-shadow)"/>
    </g>
  </defs>
  <use href="#database-mark" transform="translate(344 116) scale(4)"/>
  <text x="600" y="814" fill="#1C2A34" font-family="Arial, Helvetica, sans-serif" font-size="178" font-weight="800" letter-spacing="-9" text-anchor="middle">rehearsal</text>
  <text x="600" y="906" fill="#344754" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="10.5" text-anchor="middle">SAFER CHANGES. BRIGHTER DEPLOYS.</text>
</svg>
